name: Sync datos FCF Pirinaica

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar datos de fcf.cat
        run: python fetch_fcf.py

      - name: Commitear si hay cambios
        run: |
          git config user.name "fcf-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios, no hace falta commit."
          else
            git commit -m "Actualizar datos FCF ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
